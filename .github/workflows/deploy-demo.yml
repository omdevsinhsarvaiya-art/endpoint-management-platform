name: Deploy to AWS demo

# ---------------------------------------------------------------------------
# Pushes to main are built and released on the single-EC2 demo host.
#
# Deployment goes through AWS Systems Manager, not SSH. That choice is
# deliberate: the security group allows SSH only from one administrator IP, and
# GitHub's runners have dynamic addresses, so an SSH-based deploy would mean
# opening port 22 to the internet. SSM needs no inbound port at all -- the
# instance's own agent dials out and collects the command.
#
# Credentials belong to a dedicated IAM user whose ONLY permission is
# ssm:SendCommand against this one instance with AWS-RunShellScript, plus
# reading the result back. It cannot start instances, read S3, touch IAM, or
# reach any other resource -- the blast radius of a leak is "someone can
# redeploy the demo".
#
# OIDC would be preferable to long-lived keys and was implemented first, but
# sts:AssumeRoleWithWebIdentity is refused on this account -- the same class of
# restriction that blocks Route 53 domain registration and CloudFront here.
# Revisit once the account is verified.
#
# Required repository secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   the deploy user's key
# Required repository variables (not sensitive):
#   AWS_REGION       region of the instance
#   EC2_INSTANCE_ID  the demo instance
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys interleave on one host. Queue rather than cancel: a
# half-applied deploy that gets cancelled mid-build is worse than waiting.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and release on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy ${{ github.sha }}
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The host re-validates this SHA: it must already be contained in
          # origin/main, so this parameter cannot be used to deploy anything else.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deploy $SHA" \
            --timeout-seconds 2400 \
            --parameters "commands=[\"sudo -u ubuntu SSH_ORIGINAL_COMMAND=$SHA /home/ubuntu/deploy.sh\"],executionTimeout=[\"2400\"]" \
            --query "Command.CommandId" --output text)

          echo "command id: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

          # Poll rather than `ssm wait`: the build regularly outruns the waiter's
          # fixed retry budget on a t3.micro.
          for i in $(seq 1 160); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "::error::deploy finished as $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text | tail -40
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent --output text | tail -60
                exit 1 ;;
            esac
            sleep 15
          done

          if [ "${STATUS:-}" != "Success" ]; then
            echo "::error::timed out waiting for the deploy to finish (last status: ${STATUS:-unknown})"
            exit 1
          fi

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -60 | tee deploy-output.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "### AWS demo deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo "| URL | https://65.2.37.254.nip.io |"
            echo ""
            if [ -f deploy-output.log ]; then
              echo "<details><summary>Deploy log</summary>"
              echo ""
              echo '```'
              tail -40 deploy-output.log
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
