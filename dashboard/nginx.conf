# ---------------------------------------------------------------------------
# Dashboard + Admin API on ONE origin.
#
# The dashboard fetches "/api/<path>" and the Admin API serves "/<path>", so the
# /api prefix is stripped here. This mirrors the Vite dev proxy in
# dashboard/vite.config.ts, which is why the same frontend build works in both
# places without a configurable API base URL.
#
# TLS is NOT terminated here. In the demo topology this container sits behind
# the host's TLS entry point; see docs/deployment.md. The session cookie is
# Secure, so the public origin must be https:// or sign-in will not work.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API decides what may be cached; nginx must not add its own opinion to
    # authenticated responses.
    location /api/ {
        # Docker's embedded DNS, and proxy_pass through a VARIABLE so the name is
        # resolved per request rather than once at startup.
        #
        # Both halves matter. With a literal upstream, nginx resolves admin-api at
        # boot and REFUSES TO START if that container is not up yet ("host not
        # found in upstream") — verified against the built image. Worse, once it
        # does start it pins that IP forever, so replacing the Admin API container
        # leaves the proxy talking to an address nothing answers on.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_api admin-api:8080;

        # The dashboard calls /api/<path>; the API serves /<path>. `break` keeps
        # the rewritten URI, which is what a variable proxy_pass forwards - the
        # trailing-slash form that strips the prefix is not available here.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$admin_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # The API issues Secure cookies and builds absolute URLs from this. It
        # must read "https" even though this hop is plain HTTP, or the browser
        # is handed a cookie it will refuse to store.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Long enough for a slow query, short enough to fail visibly.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering off;
    }

    # Hashed asset filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths are client-side routes, not 404s. index.html
    # itself must never be cached, or a deploy leaves browsers on the old bundle.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Belt-and-braces headers. The APIs set their own security headers; these
    # cover the static files nginx serves directly.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 512m;   # package uploads pass through this proxy
    server_tokens off;
}
