name: endpoint-platform

# ---------------------------------------------------------------------------
# Local development infrastructure for the Endpoint Management Platform.
#
# This file provides the backing services only (PostgreSQL and Redis). The APIs,
# the migration job and the dashboard run on the host during development so they
# can be debugged and hot-reloaded. Container images for the applications belong
# to the deployment work in Phase 15.
#
# Ports are deliberately non-default (55432 / 56379) so this stack cannot collide
# with a PostgreSQL or Redis already installed on the developer's machine.
#
# Every credential comes from infra/.env, which is git-ignored. Copy
# infra/.env.example to infra/.env and generate real values before first run;
# there are no default passwords in this file.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: endpoint-platform-postgres
    restart: unless-stopped
    environment:
      # Superuser. Used by the migration job only; the APIs never connect as this role.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set POSTGRES_SUPERUSER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env}
      # Consumed by the init script to create the restricted runtime role.
      APP_DB_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER in infra/.env}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in infra/.env}
      # scram-sha-256 for host connections; the default trust/md5 is not acceptable
      # even locally, because it trains everyone to deploy the same way.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Names the database and user explicitly; a bare pg_isready reports ready
      # during the init phase, before the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2-alpine
    container_name: endpoint-platform-redis
    restart: unless-stopped
    # Password-protected even locally. Redis has no access control by default and
    # an unauthenticated instance bound to a host port is a well-known foothold.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      # REDISCLI_AUTH keeps the password out of the process list.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
    name: endpoint-platform-postgres-data
